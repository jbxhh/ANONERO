name: Android CI - Robust Build APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ndk: ['25.2.9519653','23.1.7779620']
    env:
      JAVA_VERSION: '17'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set ANDROID_SDK_ROOT
        run: echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK, NDK and CMake
        uses: android-actions/setup-sdk@v2
        with:
          api-level: 35
          build-tools: 36.0.0
          ndk: ${{ matrix.ndk }}
          cmake: '3.22.1'
          cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Print environment
        run: |
          echo "NDK version: ${{ matrix.ndk }}"
          java -version
          uname -a
          ./gradlew -v

      - name: Build (try fast, then retry with refresh-dependencies)
        id: build-step
        run: |
          set -o pipefail
          echo "Attempt 1: normal build"
          if ./gradlew clean assembleDebug --no-daemon --stacktrace; then
            echo "BUILD_STATUS=success" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Attempt 1 failed, retrying with --refresh-dependencies"
          if ./gradlew clean assembleDebug --no-daemon --refresh-dependencies --stacktrace; then
            echo "BUILD_STATUS=success" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Both attempts failed" >&2
          echo "BUILD_STATUS=failure" >> $GITHUB_OUTPUT
          exit 1

      - name: Upload APK artifact (on success)
        if: steps.build-step.outputs.BUILD_STATUS == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-ndk-${{ matrix.ndk }}
          path: app/build/outputs/apk/**/app-*-debug.apk

      - name: Collect build logs (on failure)
        if: failure()
        run: |
          mkdir -p build_logs
          echo "Saving gradle build output to build_logs/gradle_build.log"
          ./gradlew assembleDebug --no-daemon --stacktrace > build_logs/gradle_build.log 2>&1 || true
          echo "Collecting system info"
          uname -a > build_logs/uname.txt || true
          java -version > build_logs/java_version.txt 2>&1 || true
          echo "NDK used: ${{ matrix.ndk }}" > build_logs/ndk.txt || true

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-ndk-${{ matrix.ndk }}
          path: build_logs
