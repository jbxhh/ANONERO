name: Build ANONERO APK (Fixed)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 释放 GitHub 虚拟机磁盘空间（防止 C++ 编译把硬盘撑爆）
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean

      # 2. 拉取你仓库里的 ANONERO 代码
      - name: Checkout ANONERO Code
        uses: actions/checkout@v4

      # 3. 安装 Linux 底层 C++ 编译工具链
      - name: Install C++ Build Tools & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake automake libtool pkg-config yacc

      # 4. 配置 Android NDK (编译 Android C++ 库核心所需)
      - name: Setup Android NDK
        uses: nsetup/setup-ndk@v1
        with:
          ndk-version: r25c

      # 5. 克隆 Monero 核心源码并建立软链接 (对应 README 2,3,4 步)
      - name: Clone Monero and Link
        run: |
          git clone --recursive https://github.com/monero-project/monero.git $HOME/monero
          cd $HOME/monero
          git submodule update --init --force
          cd $GITHUB_WORKSPACE
          mkdir -p external-libs
          ln -s $HOME/monero external-libs/monero

      # 6. 编译 C++ 底层库 (限制 -j2 避免内存溢出 OOM)
      - name: Build External C++ Libraries
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          cd external-libs
          sudo make -j2

      # 7. 配置 Java 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 8. 同意 SDK 许可证书并赋予 gradlew 执行权限
      - name: Prepare Gradle Environment
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          chmod +x gradlew

      # 9. 配置 Gradle 缓存并打包 APK
      - name: Build Android APK
        run: ./gradlew assembleDebug

      # 10. 上传生成的 APK 到 GitHub，供你直接下载
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
