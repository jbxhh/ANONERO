name: Build ANONERO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- 准备环境 ---
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install C++ Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake automake libtool pkg-config yacc

      # --- README 步骤 1: 拉取 ANONERO 源码 ---
      - name: 1. Clone ANONERO repo
        uses: actions/checkout@v4

      # --- README 步骤 2: 云端拉取 Monero 源码 (使用 GitHub 官方源，无需洋葱) ---
      - name: 2. Clone Monero repo
        run: |
          git clone --recursive https://github.com/monero-project/monero.git $HOME/monero

      # --- README 步骤 3 & 4: 建立软链接并更新子模块 ---
      - name: 3 & 4. Link external libs & Update submodules
        run: |
          ln -s $HOME/monero external-libs/monero
          cd $HOME/monero
          git submodule update --init --force

      # --- README 步骤 5: 编译底层 C++ 库 ---
      - name: 5. Build external libs
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cd external-libs
          make -j2

      # --- README 最后一步: 打包 APK 并上传供你下载 ---
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
