name: Build ANONERO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean

      - name: Checkout ANONERO Code
        uses: actions/checkout@v4

      - name: Clone Monero Source Code
        run: |
          git clone --recursive https://github.com/monero-project/monero.git $HOME/monero
          cd $HOME/monero
          git submodule update --init --force
          cd $GITHUB_WORKSPACE
          ln -s $HOME/monero external-libs/monero

      - name: Build External C++ Libraries (Docker)
        run: |
          cd external-libs
          sudo make

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
