name: Build ANONERO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 直接拉取你当前 GitHub 仓库的所有代码
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 配置 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 安装 C++ 编译工具
      - name: Install C++ Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake automake libtool pkg-config yacc

      # 4. 编译 C++ 底层库 (对应 external-libs)
      - name: Build External C++ Libraries
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cd external-libs
          make -j2

      # 5. 给 gradlew 赋予执行权限并编译打包 APK
      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 6. 上传生成的 APK 文件
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
