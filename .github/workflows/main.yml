name: Build ANONERO APK

on:
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 释放虚拟机磁盘空间（避免编译 C++ 撑爆磁盘）
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean

      # 2. 安装并启动 Tor 服务（解决 .onion 暗网域名无法访问的问题）
      - name: Install and Start Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          sudo systemctl start tor
          # 等待 Tor 节点建立连接 (等待 10 秒)
          sleep 10

      # 3. 安装 Linux 底层 C++ 编译工具链
      - name: Install C++ Build Tools & CMake
        run: |
          sudo apt-get install -y build-essential cmake automake libtool pkg-config yacc

      # 4. 配置 Android NDK (修复了之前 nsetup 的拼写错误)
      - name: Setup Android NDK
        uses: android-actions/setup-ndk@v3
        with:
          ndk-version: r25c

      # 5. 通过 Tor 代理拉取 ANONERO 主仓库代码
      - name: Clone ANONERO Repo via Tor
        run: |
          git -c http.proxy=socks5h://127.0.0.1:9050 clone http://git.anonero5wmhraxqsvzq2ncgptq6gq4sqoto6fnkfwughf14gbt44swad.onion/ANONERO/ANONERO.git anonero-src

      # 6. 通过 Tor 代理拉取 Monero 仓库代码
      - name: Clone Monero Repo via Tor
        run: |
          git -c http.proxy=socks5h://127.0.0.1:9050 clone http://git.anonero5wmhraxqsvzq2ncgptq6gq4sqoto6fnkfwughf14gbt44swad.onion/ANONERO/monero.git $HOME/monero

      # 7. 建立软链接与更新子模块 (对应 README 3、4 步)
      - name: Link and Update Submodules
        run: |
          mkdir -p anonero-src/external-libs
          ln -s $HOME/monero anonero-src/external-libs/monero
          cd $HOME/monero
          git -c http.proxy=socks5h://127.0.0.1:9050 submodule update --init --force

      # 8. 编译底层 C++ 库 (对应 README 5 步，去掉 sudo 避免环境变量丢失)
      - name: Build External C++ Libraries
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          cd anonero-src/external-libs
          make -j2

      # 9. 配置 Java 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 10. 打包 Android APK (对应 README "fire up Android Studio")
      - name: Build Android APK
        run: |
          cd anonero-src
          chmod +x gradlew
          ./gradlew assembleDebug

      # 11. 上传编译好的 APK 供你下载
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ANONERO-Debug-APK
          path: anonero-src/app/build/outputs/apk/debug/*.apk
